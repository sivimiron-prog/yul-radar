<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YUL Radar</title>
<meta name="theme-color" content="#1f4fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YUL Radar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first feed. Sticky status bar, filter row, one column of fare cards; two columns on wide screens. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#14202e; --muted:#5b6878; --line:#d9dfe7;
  --accent:#1f4fd1; --accent-soft:#e3eafc; --on-accent:#ffffff;
  --err:#c8173a; --err-soft:#fbe4e9; --deal:#b35c00; --deal-soft:#fdf0de; --ok:#1d7a4f; --warn:#b35c00;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e141c; --surface:#16202b; --ink:#e6ecf3; --muted:#93a1b2; --line:#2a3644;
  --accent:#7ea2ff; --accent-soft:#1d2a47; --on-accent:#0e141c;
  --err:#ff6b86; --err-soft:#3a1822; --deal:#f0a54a; --deal-soft:#36260f; --ok:#5fd19b; --warn:#f0a54a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand h1{font-size:20px;font-weight:700}
.brand small{display:block;font-size:12px;color:var(--muted);font-family:var(--mono)}
.fresh{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.stale{background:var(--warn)}

main{display:flex;flex-direction:column;gap:16px;padding-block:16px 40px}
.sample{font-size:13px;font-weight:600;color:var(--deal);background:var(--deal-soft);padding:8px 12px;border-radius:6px}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px}
.summary>div{padding:10px 12px;border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:2px}
.summary>div:first-child{border-left:0}
.summary .label{font-size:10px;letter-spacing:.07em}
.summary .v{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.summary .v.err{color:var(--err)} .summary .v.deal{color:var(--deal)}

.filters{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--muted);padding:8px 6px;border-radius:6px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg.trip{grid-template-columns:repeat(4,1fr)}
.seg.trip button{font-size:13px;line-height:1.2}
@media(max-width:520px){.seg.trip{grid-template-columns:repeat(2,1fr)}}
.combo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.combo:first-child{border-top:0}
.leg{display:flex;justify-content:space-between;gap:10px;font-size:14px;grid-column:1;min-width:0}
.leg a{color:var(--ink);text-decoration:none;font-weight:600;overflow-wrap:anywhere}
.leg a::after{content:" ↗";color:var(--accent);font-weight:400}
.leg span{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ctot{grid-column:2;grid-row:1/span 3;text-align:right;align-self:center}
.ctot .p{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.ctot small{display:block;font-size:12px;color:var(--muted)}
.cstay{grid-column:1;font-size:12px;color:var(--muted)}
.lenrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.srow{display:flex;gap:8px;align-items:stretch}
.srow .searchbox{flex:1;min-width:0}
.chip{font:inherit;font-size:14px;font-weight:600;padding:0 14px;border-radius:8px;border:1px solid var(--line);background-color:var(--surface);color:var(--muted);cursor:pointer;min-height:44px;flex:none}
.chip.on{background-color:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:30px;max-width:46%;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.kindlbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.searchbox{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:44px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.list{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card .stripe{height:4px}
.card.err .stripe{background:var(--err)} .card.deal .stripe{background:var(--deal)}
.card.old{opacity:.78}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.top>div{min-width:0}
.route{font-family:var(--mono);font-size:12px;color:var(--muted)}
.city{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.price{text-align:right;flex:none}
.price .p{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.price .was{font-size:13px;color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.pill.err{background:var(--err-soft);color:var(--err)} .pill.deal{background:var(--deal-soft);color:var(--deal)}
.pct{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pct.err{color:var(--err)} .pct.deal{color:var(--deal)}
.seen{font-size:12px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.facts div{display:flex;flex-direction:column;gap:1px;min-width:0}
.reason{font-size:14px;background:var(--accent-soft);border-radius:6px;padding:8px 10px}
.reason b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
.spark{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.spark svg{flex:1;min-width:0;height:34px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
  padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px;flex:1 1 auto}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 14px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);min-height:56px}
.prow:first-child{border-top:0}
.prow .pc{font-weight:600;overflow-wrap:anywhere}
.prow .pm{font-size:13px;color:var(--muted)}
.prow .pp{font-family:var(--display);font-size:19px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.prow .pv{font-size:12px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.prow .pv.lo{color:var(--ok);font-weight:600}
.more{font:inherit;font-size:14px;font-weight:600;width:100%;padding:12px;border:0;border-top:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;min-height:44px}
.scan{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.scanrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.scanrow .btn{flex:0 0 auto;min-width:140px}
.scanmsg{font-size:14px;color:var(--muted);flex:1 1 160px;min-width:0}
.scanmsg.busy::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.setup summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent);min-height:32px;display:flex;align-items:center}
.setup ol{margin:8px 0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.setup .keyrow{display:flex;gap:8px;flex-wrap:wrap}
.setup .keyrow input{flex:1 1 200px;min-width:0}
.setup small{color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){.scanmsg.busy::before{animation:none}}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-h h2{font-size:18px}
footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;max-width:70ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar gut">
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--accent)"/><circle cx="16" cy="16" r="10" fill="none" stroke="var(--on-accent)" stroke-opacity=".45" stroke-width="1.5"/><circle cx="16" cy="16" r="5" fill="none" stroke="var(--on-accent)" stroke-opacity=".45" stroke-width="1.5"/><path d="M16 16 L26 9" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round"/><circle cx="22" cy="12" r="2.2" fill="var(--on-accent)"/></svg>
      <div><h1>YUL Radar</h1><small id="origin">Montréal–Trudeau</small></div>
    </div>
    <div class="fresh"><span class="dot" id="dot"></span><span id="fresh"></span></div>
  </div>
</header>

<main class="wrap gut">
  <div class="sample" id="sampleNote" hidden></div>
  <section class="scan" aria-label="Scan">
    <div class="scanrow"><button type="button" class="btn primary" id="scanBtn"></button><span class="scanmsg" id="scanMsg" role="status"></span></div>
    <details class="setup" id="setup"><summary id="setupSum"></summary><div id="setupBody"></div></details>
  </section>

  <section class="summary" id="summary" aria-label="Summary">
    <div><div class="label" id="lErr"></div><div class="v err" id="nErr">0</div></div>
    <div><div class="label" id="lDeal"></div><div class="v deal" id="nDeal">0</div></div>
    <div><div class="label" id="lScan"></div><div class="v" id="nScan">0</div></div>
  </section>

  <div class="filters">
    <div class="seg trip" role="group" id="trip" aria-label="Trip type">
      <button type="button" data-k="rt" aria-pressed="true"></button>
      <button type="button" data-k="out" aria-pressed="false"></button>
      <button type="button" data-k="back" aria-pressed="false"></button>
      <button type="button" data-k="combo" aria-pressed="false"></button>
    </div>
    <div class="seg" role="group" id="seg">
      <button type="button" data-f="all" aria-pressed="true"></button>
      <button type="button" data-f="likely_error" aria-pressed="false"></button>
      <button type="button" data-f="strong_deal" aria-pressed="false"></button>
    </div>
    <div class="srow"><input class="searchbox" id="q" type="search" autocomplete="off"><select class="chip" id="region" aria-label="Region"></select></div>
  </div>

  <section id="comboSec" style="display:flex;flex-direction:column;gap:10px" hidden>
    <div class="section-h"><h2 id="hCombo"></h2><span class="label" id="countCombo"></span></div>
    <div class="lenrow"><label for="stay" id="lStay"></label><select class="chip" id="stay"></select></div>
    <div id="clist"></div>
    <div class="label" style="text-transform:none;letter-spacing:0;font-weight:400" id="comboNote"></div>
  </section>

  <section id="findSec" style="display:flex;flex-direction:column;gap:10px">
    <div class="section-h"><h2 id="hList"></h2><span class="label" id="count"></span></div>
    <div class="list" id="list"></div>
  </section>

  <section id="allSec" style="display:flex;flex-direction:column;gap:10px">
    <div class="section-h"><h2 id="hAll"></h2><span class="label" id="countAll"></span></div>
    <div id="plist"></div>
  </section>

  <footer id="foot"></footer>
</main>
<div class="toast" id="toast" hidden></div>

  moreC:n=>`Show ${n} combos`,combo:"Trip combos",comboH:"Best one-way combos",stayL:"Time away",total:"total",
  stays:{"7-14":"1–2 weeks","14-28":"2–4 weeks","28-60":"1–2 months","60-120":"2–4 months"},
  days2:n=>`${n} days away`,combos:n=>n+" combos",noCombo:"No combos for these choices. Try another length or region.",
  comboNote:"Two separate tickets: if the first flight is late, the second one isn't protected. Tap a city to check each flight on Google Flights.",
  allH:"Cheapest fare to every destination",allBack:"Cheapest flight back from every city",tap:"Tap a row to check it on Google Flights",vs:p=>p<0?`${-p}% below normal`:p>0?`${p}% above normal`:"Normal price",
  more:n=>`Show all ${n} destinations`,less:"Show fewer",nfound:q=>`No “${q}” in the latest scan.`,gsearch:q=>`Search “${q}” on Google Flights`,dest:n=>n+(n===1?" destination":" destinations"),
  last:"Last scan",sample:"Sample data. These fares are simulated.",
  foot:(d,e)=>`Deal at ${d}% or more below normal, likely error at ${e}% or more. Fares come from recent searches and may already be gone, so check before booking. After booking an error fare, wait a few days before paying for anything non-refundable.`
};
document.documentElement.lang=FR?"fr":"en";
const $=id=>document.getElementById(id);
const money=n=>FR?Math.round(n).toLocaleString("fr-CA")+" $":"$"+Math.round(n).toLocaleString("en-CA");
const fmtDate=s=>new Date(s+"T12:00:00").toLocaleDateString(FR?"fr-CA":"en-CA",{month:"short",day:"numeric"});
const minsAgo=iso=>Math.max(0,Math.round((Date.now()-new Date(iso))/60000));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("origin").textContent=D.origin+" · Montréal–Trudeau";
$("lErr").textContent=T.errors;$("lDeal").textContent=T.deals;$("lScan").textContent=T.scanned;
$("q").placeholder=T.search;$("region").innerHTML=Object.entries(T.regions).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
const tripB=[...$("trip").children];tripB[0].textContent=T.rt;tripB[1].textContent=T.out;tripB[2].textContent=T.back;tripB[3].textContent=T.combo;
$("hCombo").textContent=T.comboH;$("lStay").textContent=T.stayL;$("comboNote").textContent=T.comboNote;
$("stay").innerHTML=Object.entries(T.stays).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");$("hList").textContent=T.list;$("hAll").textContent=T.allH;
const segB=[...$("seg").children];segB[0].textContent=T.all;segB[1].textContent=T.errors;segB[2].textContent=T.deals;
$("foot").innerHTML=`<span>${esc(T.foot(D.deal_pct,D.error_pct))}</span>`;
if(D.sample){$("sampleNote").hidden=false;$("sampleNote").textContent=T.sample}

function freshness(){const m=minsAgo(D.generated);$("fresh").textContent=T.last+" · "+T.ago(m);$("dot").classList.toggle("stale",m>8*60)}
freshness();setInterval(freshness,60000);

const finds=D.finds;


function spark(dest,price){
  const h=(D.history[dest]||[]).map(p=>p[1]);if(h.length<3)return "";
  const W=200,H=34,mx=Math.max(...h,price),mn=Math.min(...h,price),sp=(mx-mn)||1;
  const x=i=>2+i*(W-4)/(h.length-1),y=v=>mx===mn?H/2:3+(mx-v)*(H-6)/sp;
  const pts=h.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
   <polygon points="2,${H} ${pts} ${W-2},${H}" fill="var(--accent-soft)"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
   <circle cx="${x(h.length-1)}" cy="${y(h[h.length-1])}" r="2.5" fill="var(--accent)"/></svg><span>${T.low}<br><b class="num" style="color:var(--ink)">${money(Math.min(...h))}</b></span></div>`;
}

let filter="all",query="",showAll=false,kind="rt",region="all";
try{kind=localStorage.getItem("yulradar.kind")||"rt";region=localStorage.getItem("yulradar.region")||"all"}catch(e){}
if(!T.regions[region])region="all";
if(!["rt","out","back","combo"].includes(kind))kind="rt";
const inRegion=o=>region==="all"||(o.regions||[]).includes(region);
const routeOf=(k,code)=>k==="back"?`${code} → ${D.origin}`:k==="out"?`${D.origin} → ${code}`:`${D.origin} ⇄ ${code}`;
const datesOf=o=>o.return?`${fmtDate(o.depart)} – ${fmtDate(o.return)}`:fmtDate(o.depart);
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const prices=D.prices||[];
function renderPrices(){
  const q=norm(query.trim());
  const match=prices.filter(p=>p.kind===kind&&inRegion(p)&&(!q||norm(p.city+" "+p.dest+" "+p.alt).includes(q)));
  $("hAll").textContent=kind==="back"?T.allBack:T.allH;$("countAll").textContent=T.dest(match.length);
  const el=$("plist");
  if(!match.length&&q){
    // the place may exist under another trip type or region: offer a shortcut
    const elsewhere=prices.filter(p=>norm(p.city+" "+p.dest+" "+p.alt).includes(q));
    const views=[...new Set(elsewhere.map(p=>p.kind))];
    if(elsewhere.length){
      const k0=views.includes(kind)?kind:views[0];
      const ex=elsewhere.find(p=>p.kind===k0);
      el.innerHTML=`<div class="empty">${esc(T.inOther(ex.city,T[k0]))}<br><br><button type="button" class="btn primary" id="goOther">${esc(T.showIt(T[k0]))}</button></div>`;
      $("goOther").onclick=()=>{kind=k0;region="all";store.set("yulradar.kind",kind);store.set("yulradar.region",region);render()};
      return}
  }
  if(!match.length){
    const qq=query.trim()||T.regions[region];
    const g="https://www.google.com/travel/flights?q="+encodeURIComponent(kind==="back"?`One way flights from ${qq} to ${D.origin}`:kind==="out"?`One way flights from ${D.origin} to ${qq}`:`Flights from ${D.origin} to ${qq}`);
    el.innerHTML=`<div class="empty">${esc(T.nfound(qq))}<br><br><a class="btn primary" href="${esc(g)}" target="_blank" rel="noopener">${esc(T.gsearch(qq))}</a></div>`;return}
  const list=(q||showAll)?match:match.slice(0,12);
  el.innerHTML=`<div class="plist">${list.map(p=>{
    const pct=p.normal?Math.round((p.price/p.normal-1)*100):0;
    return `<a class="prow" href="${esc(p.google_link)}" target="_blank" rel="noopener">
      <span class="pc">${esc(kind==="back"?p.city+" → Montréal":p.city)}</span><span class="pp">${money(p.price)}</span>
      <span class="pm">${esc(p.country)}${p.country?" · ":""}${datesOf(p)} · ${T.stops(p.stops)}</span>
      <span class="pv ${pct<=-15?"lo":""}">${T.vs(pct)}</span></a>`}).join("")}
   ${!q&&match.length>12?`<button type="button" class="more" id="moreBtn">${showAll?T.less:T.more(match.length)}</button>`:""}</div>
   <div class="label" style="text-transform:none;letter-spacing:0;font-weight:400;margin-top:6px">${T.tap}</div>`;
  const mb=$("moreBtn");if(mb)mb.onclick=()=>{showAll=!showAll;renderPrices()};
}
try{const s=localStorage.getItem("yulradar.filter");if(s)filter=s}catch(e){}

let stay="14-28";try{stay=localStorage.getItem("yulradar.stay")||stay}catch(e){}
if(!T.stays[stay])stay="14-28";
const owLink=(k,code,d)=>"https://www.google.com/travel/flights?q="+encodeURIComponent(k==="out"?`One way flights from ${D.origin} to ${code} on ${d}`:`One way flights from ${code} to ${D.origin} on ${d}`);
function renderCombos(){
  $("stay").value=stay;
  const [lo,hi]=stay.split("-").map(Number);const q=norm(query.trim());
  const ok=o=>inRegion({regions:o.r});
  const ow=D.oneways||[];
  const outs=ow.filter(o=>o.k==="out"&&ok(o)),backs=ow.filter(o=>o.k==="back"&&ok(o));
  const best={};
  for(const o of outs){const od=new Date(o.d+"T12:00:00");
    for(const b of backs){const days=Math.round((new Date(b.d+"T12:00:00")-od)/864e5);
      if(days<lo||days>hi)continue;
      if(q&&!norm(o.n+" "+o.c+" "+b.n+" "+b.c).includes(q))continue;
      const key=o.c+">"+b.c,tot=o.p+b.p;
      if(!best[key]||tot<best[key].tot)best[key]={o,b,tot,days}}}
  const list=Object.values(best).sort((x,y)=>x.tot-y.tot).slice(0,showAll?60:15);
  const n=Object.keys(best).length;$("countCombo").textContent=T.combos(n);
  if(!list.length){$("clist").innerHTML=`<div class="empty">${T.noCombo}</div>`;return}
  $("clist").innerHTML=`<div class="plist">${list.map(x=>`<div class="combo">
     <div class="leg"><a href="${esc(owLink("out",x.o.c,x.o.d))}" target="_blank" rel="noopener">Montréal → ${esc(x.o.n)}</a><span>${fmtDate(x.o.d)} · ${money(x.o.p)}</span></div>
     <div class="leg"><a href="${esc(owLink("back",x.b.c,x.b.d))}" target="_blank" rel="noopener">${esc(x.b.n)} → Montréal</a><span>${fmtDate(x.b.d)} · ${money(x.b.p)}</span></div>
     <div class="cstay">${T.days2(x.days)} · ${T.stops(x.o.s)} / ${T.stops(x.b.s)}</div>
     <div class="ctot"><div class="p">${money(x.tot)}</div><small>${T.total}</small></div></div>`).join("")}
   ${n>15?`<button type="button" class="more" id="moreCombo">${showAll?T.less:T.moreC(Math.min(n,60))}</button>`:""}</div>`;
  const mc=$("moreCombo");if(mc)mc.onclick=()=>{showAll=!showAll;renderCombos()};
}
$("stay").onchange=e=>{stay=e.target.value;try{localStorage.setItem("yulradar.stay",stay)}catch(err){}renderCombos()};

function render(){
  const isCombo=kind==="combo";
  $("comboSec").hidden=!isCombo;$("findSec").hidden=isCombo;$("allSec").hidden=isCombo;$("seg").hidden=isCombo;$("summary").hidden=isCombo;
  tripB.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===kind)));$("region").value=region;$("region").classList.toggle("on",region!=="all");
  if(isCombo){renderCombos();return}
  segB.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===filter)));
  renderPrices();
  const q=norm(query.trim());
  tripB.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===kind)));$("region").value=region;$("region").classList.toggle("on",region!=="all");
  const alt=Object.fromEntries(prices.map(p=>[p.dest,p.alt]));
  const mine=finds.filter(f=>(f.kind||"rt")===kind&&inRegion(f));
  $("nErr").textContent=mine.filter(f=>f.verdict==="likely_error").length;
  $("nDeal").textContent=mine.filter(f=>f.verdict==="strong_deal").length;
  $("nScan").textContent=prices.filter(p=>p.kind===kind&&inRegion(p)).length;
  const shown=mine.filter(f=>(filter==="all"||f.verdict===filter)&&(!q||norm(f.city+" "+f.dest+" "+(alt[f.dest]||"")).includes(q)));
  $("count").textContent=T.shown(shown.length);
  if(!mine.length){$("list").innerHTML=`<div class="empty">${T.empty}</div>`;return}
  if(!shown.length){$("list").innerHTML=`<div class="empty">${T.noMatch}</div>`;return}
  $("list").innerHTML=shown.map((f,i)=>{
    const k=f.verdict==="likely_error"?"err":"deal";
    const fk=f.kind||"rt";const days=f.return?Math.round((new Date(f.return)-new Date(f.depart))/864e5):0;
    const old=!f.in_latest;
    return `<article class="card ${k} ${old?"old":""}">
     <div class="stripe"></div><div class="cbody">
      <div class="top"><div><div class="route">${esc(routeOf(fk,f.place||f.dest))}</div><div class="city">${esc(fk==="back"?f.city+" → Montréal":f.city)}</div></div>
       <div class="price"><div class="p">${money(f.price)}</div><div class="was">${money(f.normal_price)}</div><div class="kindlbl">${fk==="rt"?T.rtl:T.ow}</div></div></div>
      <div class="tags"><span class="pill ${k}">${f.verdict==="likely_error"?T.err1:T.deal1}</span><span class="pct ${k}">−${f.drop_pct}%</span>
       <span class="seen">· ${T.seen} ${T.ago(minsAgo(f.found))} · ${old?T.older:T.latest}</span></div>
      <div class="facts"><div><span class="label">${T.dates}</span>${datesOf(f)}</div>
       <div><span class="label">${T.trip}</span>${fk==="rt"?T.days(days):T.oneway}</div>
       <div><span class="label">${T.airline}</span>${esc(f.airline||"—")} · ${T.stops(f.stops)}</div></div>
      ${f.reason?`<div class="reason"><b>${T.why}</b>${esc(f.reason)}</div>`:""}
      ${spark(f.key||f.dest,f.price)}
      <div class="actions"><a class="btn primary" href="${esc(f.google_link)}" target="_blank" rel="noopener">${T.google}</a>
       ${f.link?`<a class="btn" href="${esc(f.link)}" target="_blank" rel="noopener">${T.avia}</a>`:""}
       <button type="button" class="btn" data-copy="${i}">${T.copy}</button></div>
     </div></article>`}).join("");
  $("list").querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copy(shown[+b.dataset.copy]));
}
/* ---- Scan now ---- */
const REPO=D.repo||(location.hostname.endsWith(".github.io")?location.hostname.split(".")[0]+"/"+location.pathname.split("/").filter(Boolean)[0]:"");
const store={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
let token=store.get("yulradar.token"),busy=false;
const tokenURL="https://github.com/settings/personal-access-tokens/new?"+new URLSearchParams({name:"YUL Radar phone",description:"Lets the YUL Radar page start a scan",expires_in:"366",actions:"write"});
function scanMsg(m,spin){$("scanMsg").textContent=m;$("scanMsg").classList.toggle("busy",!!spin)}
function setupUI(){
  $("scanBtn").textContent=token?T.scan:T.scanGh;
  $("setupSum").textContent=token?"✓ "+T.setupOn:T.setup;
  $("setupBody").innerHTML=token
    ?`<div class="keyrow" style="margin-top:6px"><button type="button" class="btn" id="rmKey">${T.remove}</button></div><small>${T.keyNote}</small>`
    :`<ol>${T.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
      <div class="keyrow"><a class="btn" href="${esc(tokenURL)}" target="_blank" rel="noopener">${T.mk}</a></div>
      <div class="keyrow" style="margin-top:8px"><input class="searchbox" id="keyIn" type="password" autocomplete="off" placeholder="${T.paste}"><button type="button" class="btn primary" id="saveKey">${T.save}</button></div>
      <small>${T.keyNote}</small>`;
  if($("saveKey"))$("saveKey").onclick=()=>{const v=$("keyIn").value.trim();if(!v)return;token=v;store.set("yulradar.token",v);toast(T.saved);setupUI();scanMsg(T.idle)};
  if($("rmKey"))$("rmKey").onclick=()=>{token="";store.set("yulradar.token","");toast(T.removed);setupUI();scanMsg(T.noKey)};
  if(!busy)scanMsg(token?T.idle:T.noKey);
}
function api(path,opts){return fetch("https://api.github.com/repos/"+REPO+path,Object.assign({cache:"no-store"},opts||{},{headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"}}))}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function startScan(auto){
  if(busy)return;
  if(!token||!REPO){if(REPO)window.location.href="https://github.com/"+REPO+"/actions/workflows/scan.yml";return}
  busy=true;$("scanBtn").disabled=true;scanMsg(auto?T.auto:T.starting,true);
  const t0=Date.now();store.set("yulradar.lastStart",String(t0));
  try{
    const r=await api("/actions/workflows/scan.yml/dispatches",{method:"POST",body:JSON.stringify({ref:"main"})});
    if(r.status===401||r.status===403||r.status===404){scanMsg(T.badKey);$("setup").open=true;return}
    if(!r.ok){scanMsg(T.failed);return}
    for(let i=0;i<60;i++){
      await sleep(10000);
      scanMsg(T.scanning(Math.max(1,Math.round((Date.now()-t0)/60000))),true);
      let run=null;
      try{const j=await (await api("/actions/runs?event=workflow_dispatch&per_page=5")).json();
        run=(j.workflow_runs||[]).find(x=>new Date(x.created_at).getTime()>=t0-90000)}catch(e){}
      if(run&&run.status==="completed"){
        if(run.conclusion==="success"){scanMsg(T.done,true);await sleep(8000);location.replace(location.pathname+"?t="+Date.now());return}
        scanMsg(T.failed);return}
    }
    scanMsg(T.failed);
  }catch(e){scanMsg(T.netErr)}
  finally{busy=false;$("scanBtn").disabled=false}
}
$("scanBtn").onclick=()=>startScan(false);
setupUI();
if(token&&minsAgo(D.generated)>180&&Date.now()-Number(store.get("yulradar.lastStart")||0)>30*60000)startScan(true);

function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,1800)}
function copy(f){
  const text=(f.alert||`${f.city} ${money(f.price)}`)+"\n"+f.google_link;
  try{navigator.clipboard.writeText(text).then(()=>toast(T.copied),()=>toast(T.copyFail))}catch(e){toast(T.copyFail)}
}
segB.forEach(b=>b.onclick=()=>{filter=b.dataset.f;try{localStorage.setItem("yulradar.filter",filter)}catch(e){}render()});
$("q").addEventListener("input",e=>{query=e.target.value;render()});
tripB.forEach(b=>b.onclick=()=>{kind=b.dataset.k;showAll=false;try{localStorage.setItem("yulradar.kind",kind)}catch(e){}render()});
$("region").onchange=e=>{region=e.target.value;showAll=false;try{localStorage.setItem("yulradar.region",region)}catch(e){}render()};
render();
})();
</script>
</body>
</html>
