name: Scan fares from YUL

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:           # adds a "Run workflow" button
    inputs:
      test_alert:
        description: "Only send a test message to Telegram/email"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: radar

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scan
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: smtp.gmail.com
          DEAL_THRESHOLD: ${{ vars.DEAL_THRESHOLD || '0.40' }}
          ERROR_THRESHOLD: ${{ vars.ERROR_THRESHOLD || '0.55' }}
          ALERT_LANGUAGE: ${{ vars.ALERT_LANGUAGE || 'en' }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python radar.py --test-alert
          elif [ -z "$TRAVELPAYOUTS_TOKEN" ]; then
            echo "No TRAVELPAYOUTS_TOKEN secret yet, so this run uses sample data."
            python radar.py --sample
          else
            python radar.py
          fi
      - name: Save price history
        if: ${{ inputs.test_alert != true }}
        run: |
          git config user.name "yul-radar"
          git config user.email "yul-radar@users.noreply.github.com"
          git add data/radar.db data/cities.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Scan $(date -u +%F_%H%M)"
          git push
      - name: Prepare phone page
        if: ${{ inputs.test_alert != true }}
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.test_alert != true }}
        with:
          path: site
      - name: Publish phone page
        if: ${{ inputs.test_alert != true }}
        id: deploy
        uses: actions/deploy-pages@v4
